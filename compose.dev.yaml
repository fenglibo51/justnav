# JustNav —— 本地开发
#
#   docker compose -f compose.dev.yaml up -d --build
#
# 跟正式版的区别：
#   · 用 build 从当前源码构建，不拉 GHCR 镜像
#   · 镜像 tag 是 :dev，跟正式版并存不冲突
#
# 改完代码后：
#   docker compose -f compose.dev.yaml up -d --build
#
# 不想每次重建镜像的话，也可以 go build 出二进制直接挂进去：
#   CGO_ENABLED=0 go build -o bin/justnav .
#   CGO_ENABLED=0 go build -o bin/justnav-discovery ./cmd/justnav-discovery
# 然后把下面的 build: 换成：
#   image: justnav:dev
#   entrypoint: ["/app/justnav"]
#   volumes 里加 - ./bin:/app:ro

services:
  justnav:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
    image: justnav:dev
    container_name: justnav-dev
    restart: unless-stopped
    ports:
      - "8523:8523"
    environment:
      TZ: Asia/Shanghai
      JUSTNAV_PORT: "8523"
      JUSTNAV_DATA_DIR: /data
      JUSTNAV_SITE_NAME: JustNav
      JUSTNAV_PROBE: "true"
      JUSTNAV_DISCOVERY_FILE: /run/justnav-discovery/containers.json
      JUSTNAV_DISCOVERY_STALE_SEC: "60"
      JUSTNAV_DOCKER_SCAN_ALL: "true"
      JUSTNAV_INTERNAL_HOST: "192.168.1.10"
      JUSTNAV_AUTH: "true"
      JUSTNAV_USER: admin
      JUSTNAV_PASSWORD: "${JUSTNAV_PASSWORD:-}"
      JUSTNAV_COOKIE_SECURE: "false"
    volumes:
      - ./data-dev:/data:rw
      - justnav_discovery_dev:/run/justnav-discovery:ro

  justnav-discovery:
    build:
      context: .
      dockerfile: Dockerfile.discovery
    image: justnav-discovery:dev
    container_name: justnav-discovery-dev
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      JUSTNAV_DISCOVERY_OUT: /out/containers.json
      JUSTNAV_DISCOVERY_INTERVAL_SEC: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - justnav_discovery_dev:/out

volumes:
  justnav_discovery_dev:
