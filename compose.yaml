# JustNav 默认部署
#
# 两个服务是分开的：
#   justnav      主程序，提供 Web 界面。★ 它不挂 Docker Socket
#   discovery    采集器，唯一持有 Socket 的进程，只把容器列表写成 JSON
#
# 默认只启动 justnav。想要「待收录」（自动发现容器）才启用 discovery：
#
#   docker compose up -d                       # 只有主程序
#   docker compose --profile discovery up -d   # 加上自动发现

services:
  justnav:
    image: justnav:local
    container_name: justnav
    restart: unless-stopped
    ports:
      - "8522:8522"
    environment:
      TZ: Asia/Shanghai
      JUSTNAV_PORT: "8522"
      JUSTNAV_DATA_DIR: /data
      JUSTNAV_SITE_NAME: JustNav
      JUSTNAV_WALLPAPER: "true"
      JUSTNAV_WALLPAPER_KEEP_DAYS: "30"
      JUSTNAV_WALLPAPER_MAX_BYTES: "314572800"
      JUSTNAV_PROBE: "true"
      JUSTNAV_PROBE_INTERVAL_SEC: "60"
      JUSTNAV_PROBE_TIMEOUT_SEC: "4"
      JUSTNAV_PROBE_THRESHOLD: "2"
      JUSTNAV_PROBE_INSECURE: "true"

      # ---- Docker 自动发现（可选）----
      # 指向 discovery 写出来的快照文件。留空 = 未启用，界面上显示「未启用」。
      # 超过 STALE_SEC 没更新就判定数据过期（采集器默认 15 秒一次，这里留 4 倍余量）。
      JUSTNAV_DISCOVERY_FILE: /run/justnav-discovery/containers.json
      JUSTNAV_DISCOVERY_STALE_SEC: "60"
      # 没打 nav.* 标签、但有端口映射的运行容器，也列进「待收录」
      JUSTNAV_DOCKER_SCAN_ALL: "true"

      # 内网地址:给「待收录」拼候选地址用(走反代时不能拿域名拼)
      # ⚠️ 改成你自己 NAS / 主机的内网地址
      JUSTNAV_INTERNAL_HOST: "192.168.1.10"

      # 登录认证
      JUSTNAV_AUTH: "true"
      JUSTNAV_USER: admin
      # 可选。只在「一个账号都没有」的首次启动时用于创建管理员:
      #   留空  → 默认 admin / admin(登录后请立刻在设置里改掉)
      #   有值  → 用它作为初始密码
      # 已有账号后这个变量不再生效,改密码走「设置 → 改密」。
      JUSTNAV_PASSWORD: "${JUSTNAV_PASSWORD:-}"
      # 走 HTTPS 反代时改成 true(cookie 加 Secure)
      JUSTNAV_COOKIE_SECURE: "false"
    volumes:
      - ./data:/data:rw
      # 只读挂快照。主程序写不了它，只有 discovery 能写。
      - justnav_discovery:/run/justnav-discovery:ro
    # ⚠️ 这里【绝对不要】加 /var/run/docker.sock —— 那等于把宿主机 root
    #    交给一个对外的 Web 应用。Docker API 没有只读概念，读列表和创建
    #    特权容器走同一个 socket，`:ro` 挡不住。

  # ------------------------------------------------------------------
  # 采集器：唯一持有 Docker Socket 的进程
  #
  # 它被刻意做成「什么都干不了」：
  #   没有 HTTP 服务（network_mode: none，压根没网卡）
  #   没有 shell、没有 curl、没有 docker CLI（scratch 镜像里就一个二进制）
  #   根文件系统只读，所有 capabilities 丢掉，禁止提权
  #   API 路径写死成 GET /containers/json，不接受任何外部输入
  #   只输出白名单字段（Env / Mounts / HostConfig 一个字节都不写）
  #
  # ⚠️ 但它【仍然持有完整的 Docker 权限】—— 这是 Docker API 的固有特性，
  #    不是本项目的实现问题。这个方案缩小的是"被利用后能干什么"，
  #    不是"权限本身"。详见 docs/docker-socket-security.md
  # ------------------------------------------------------------------
  discovery:
    image: justnav-discovery:local
    container_name: justnav-discovery
    profiles: ["discovery"]
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      JUSTNAV_DISCOVERY_OUT: /out/containers.json
      JUSTNAV_DISCOVERY_INTERVAL_SEC: "15"
    volumes:
      # :ro 只限制「文件能不能被写」，不限制 Docker API 能干什么。
      # 加它是为了防止采集器意外破坏 socket 文件本身。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # 只有这个服务对共享卷有写权限
      - justnav_discovery:/out
    # 不设 ports、不设 expose —— 这个进程不提供任何网络服务

volumes:
  justnav_discovery:
