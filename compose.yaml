# JustNav —— 正式部署
#
#   docker compose up -d
#
# 默认起两个容器：主程序 + 容器采集器（自动发现 NAS 上的服务）。
#
# 不想要自动发现：把下面 justnav-discovery 整段注释掉，
# 或者把主程序里的 JUSTNAV_DISCOVERY_FILE 留空。
#
# 本地开发（要改代码）用 compose.dev.yaml，别用这个。

services:
  justnav:
    # 想固定版本回滚就把 latest 换成具体版本，比如 :1.2.0
    image: ghcr.io/fenglibo51/justnav:latest
    container_name: justnav
    restart: unless-stopped
    ports:
      - "8522:8522"
    environment:
      TZ: Asia/Shanghai
      JUSTNAV_PORT: "8522"
      JUSTNAV_DATA_DIR: /data
      JUSTNAV_SITE_NAME: JustNav
      JUSTNAV_WALLPAPER: "true"
      JUSTNAV_WALLPAPER_KEEP_DAYS: "30"
      JUSTNAV_WALLPAPER_MAX_BYTES: "314572800"
      JUSTNAV_PROBE: "true"
      JUSTNAV_PROBE_INTERVAL_SEC: "60"
      JUSTNAV_PROBE_TIMEOUT_SEC: "4"
      JUSTNAV_PROBE_THRESHOLD: "2"
      JUSTNAV_PROBE_INSECURE: "true"

      # Docker 自动发现：读采集器写出来的快照
      # 留空 = 未启用，界面上「待收录」显示「未启用」，不是故障
      JUSTNAV_DISCOVERY_FILE: /run/justnav-discovery/containers.json
      JUSTNAV_DISCOVERY_STALE_SEC: "60"
      # 没打 nav.* 标签、但有端口映射的运行容器也列进「待收录」
      JUSTNAV_DOCKER_SCAN_ALL: "true"

      # 改成你自己 NAS / 主机的内网地址
      JUSTNAV_INTERNAL_HOST: "192.168.1.10"

      JUSTNAV_AUTH: "true"
      JUSTNAV_USER: admin
      # 只在还没有任何账号时生效，之后改密码走界面
      JUSTNAV_PASSWORD: "${JUSTNAV_PASSWORD:-}"
      # 走 HTTPS 反代时改成 true
      JUSTNAV_COOKIE_SECURE: "false"
    volumes:
      - ./data:/data:rw
      # 只读挂快照，主程序写不了
      - justnav_discovery:/run/justnav-discovery:ro
    # ★ 主程序不挂 /var/run/docker.sock

  # ------------------------------------------------------------------
  # 采集器：负责读 Docker 的容器列表
  #
  # ⚠️ 这个容器会挂载 Docker Socket，等于持有宿主机最高权限。
  #    拆成独立进程只是为了让主程序拿不到它，不是消灭这个权限。
  #
  # 不想要就把这一段整块注释掉。
  # ------------------------------------------------------------------
  justnav-discovery:
    image: ghcr.io/fenglibo51/justnav-discovery:latest
    container_name: justnav-discovery
    restart: unless-stopped
    network_mode: none      # 没有网卡，不提供任何网络服务
    read_only: true         # 根文件系统只读
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      JUSTNAV_DISCOVERY_OUT: /out/containers.json
      JUSTNAV_DISCOVERY_INTERVAL_SEC: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - justnav_discovery:/out

volumes:
  justnav_discovery:
