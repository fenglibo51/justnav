# JustNav
#
# 默认启动 justnav 主程序。
#
# 想要「Docker 自动发现」（自动列出 NAS 上的容器）就多起一个采集器：
#
#   docker compose up -d                       # 只要主程序（推荐先这样）
#   docker compose --profile discovery up -d   # 加上容器自动发现
#
# 不想要自动发现 → 什么都不用做，默认就是关的。

services:
  justnav:
    image: justnav:local
    container_name: justnav
    restart: unless-stopped
    # 镜像里的 ENTRYPOINT 是烤进去的旧二进制，这里改成跑 bin 挂载的实体文件，
    # go build 后 restart 即生效
    entrypoint: ["/app/justnav"]
    ports:
      - "8522:8522"
    environment:
      TZ: Asia/Shanghai
      JUSTNAV_PORT: "8522"
      JUSTNAV_DATA_DIR: /data
      JUSTNAV_SITE_NAME: JustNav
      JUSTNAV_WALLPAPER: "true"
      JUSTNAV_WALLPAPER_KEEP_DAYS: "30"
      JUSTNAV_WALLPAPER_MAX_BYTES: "314572800"
      JUSTNAV_PROBE: "true"
      JUSTNAV_PROBE_INTERVAL_SEC: "60"
      JUSTNAV_PROBE_TIMEOUT_SEC: "4"
      JUSTNAV_PROBE_THRESHOLD: "2"
      JUSTNAV_PROBE_INSECURE: "true"

      # ---- Docker 自动发现（可选，配合下面的 justnav-discovery）----
      # 留空 = 未启用，界面上「待收录」显示「未启用」，不是故障
      JUSTNAV_DISCOVERY_FILE: /run/justnav-discovery/containers.json
      JUSTNAV_DISCOVERY_STALE_SEC: "60"
      # 没打 nav.* 标签、但有端口映射的运行容器也列进「待收录」
      JUSTNAV_DOCKER_SCAN_ALL: "true"

      JUSTNAV_INTERNAL_HOST: "192.168.1.10"   # 改成你自己的内网地址
      JUSTNAV_AUTH: "true"
      JUSTNAV_USER: admin
      JUSTNAV_PASSWORD: "${JUSTNAV_PASSWORD:-}"
      JUSTNAV_COOKIE_SECURE: "false"          # 走 HTTPS 反代时改 true
    volumes:
      - ./data:/data:rw
      - justnav_discovery:/run/justnav-discovery:ro
    # ★ 主程序不挂 /var/run/docker.sock

  # ------------------------------------------------------------------
  # 采集器：负责读 Docker 的容器列表
  #
  # 为什么不把 socket 直接挂给主程序：那等于把 NAS 的最高权限交出去。
  # 拆成这个独立进程后，主程序被攻破也拿不到 Docker 权限。
  #
  # 不启用时这一段完全不会启动（profile: discovery）
  # ------------------------------------------------------------------
  justnav-discovery:
    image: justnav-discovery:local
    container_name: justnav-discovery
    profiles: ["discovery"]
    restart: unless-stopped
    network_mode: none      # 没有网卡，不提供任何网络服务
    read_only: true         # 根文件系统只读
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Asia/Shanghai
      JUSTNAV_DISCOVERY_OUT: /out/containers.json
      JUSTNAV_DISCOVERY_INTERVAL_SEC: "15"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - justnav_discovery:/out

volumes:
  justnav_discovery:
